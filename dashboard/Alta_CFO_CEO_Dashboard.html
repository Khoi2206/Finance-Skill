<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Alta CFO · CEO Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky control bar (công ty · kỳ) → tabs → bảng điều hành dạng lưới; mọi con số bấm được để truy xuất dòng gốc. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eef1f0; --fg:#141a1d; --muted:#56626a; --faint:#8a959c;
  --line:#dce2e0; --accent:#1d5d8c; --accent-ink:#ffffff; --accent-soft:#e3edf5;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s7:#6250d6;
  --seq1:#86b6ef; --seq2:#5598e7; --seq3:#2a78d6; --seq4:#1c5cab; --seq5:#104281; --nodata:#c9cfcd;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#0b7a0b; --crit-ink:#b02a2a;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1315; --surface:#171c1f; --surface-2:#1e2427; --fg:#e7ecea; --muted:#a3adb3; --faint:#76828a;
  --line:#2b3337; --accent:#79afdb; --accent-ink:#0f1315; --accent-soft:#1d2c38;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s7:#9085e9;
  --seq1:#184f95; --seq2:#1c5cab; --seq3:#2a78d6; --seq4:#5598e7; --seq5:#9ec5f4; --nodata:#3a4246;
  --good-ink:#3cc93c; --crit-ink:#ef7b7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1315; --surface:#171c1f; --surface-2:#1e2427; --fg:#e7ecea; --muted:#a3adb3; --faint:#76828a;
  --line:#2b3337; --accent:#79afdb; --accent-ink:#0f1315; --accent-soft:#1d2c38;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s7:#9085e9;
  --seq1:#184f95; --seq2:#1c5cab; --seq3:#2a78d6; --seq4:#5598e7; --seq5:#9ec5f4; --nodata:#3a4246;
  --good-ink:#3cc93c; --crit-ink:#ef7b7b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
select,input[type=text],input[type=month],input[type=number]{font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:0;border-top:1px solid var(--line)}
nav.tabs a{color:var(--muted);text-decoration:none;padding:9px 12px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
.demo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:13px}
.demo b{font-weight:600}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit-ink)}
h2{font-size:15px;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:600;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sec-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.sec-h p{margin:0;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:14px}
.g-tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .lb{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.tile .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);min-height:20px}
.tile svg.spark{width:100%;height:30px;display:block}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.up{color:var(--good-ink)} .chip.down{color:var(--crit-ink)}
.chip.st-good::before,.chip.st-warn::before,.chip.st-crit::before{content:"";width:7px;height:7px;border-radius:50%}
.chip.st-good::before{background:var(--good)} .chip.st-warn::before{background:var(--warn)} .chip.st-crit::before{background:var(--crit)}
.chart{width:100%;height:280px;min-width:0}
.chart.tall{height:340px} .chart.short{height:220px}
.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--mono);font-size:12px}
tr.sub td{color:var(--muted)} tr.tot td{font-weight:600} tr.pct td{color:var(--muted);font-style:italic}
td.click,tr.click{cursor:pointer} td.click:hover,tr.click:hover td{background:var(--accent-soft)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--muted);margin:0}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:var(--r)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:15px}
.cov{display:grid;gap:2px;font-size:11px}
.cov div{padding:3px 2px;text-align:center;border-radius:3px;font-family:var(--mono)}
.cov .h{color:var(--muted)} .cov .on{background:var(--accent-soft);color:var(--fg)} .cov .off{background:var(--surface-2);color:var(--faint)}
.ok{color:var(--good-ink);font-weight:600} .bad{color:var(--crit-ink);font-weight:600}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.step .k{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500}
.step p,.step li{margin:0;font-size:13px;color:var(--muted)}
.step ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
code,.code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
pre.code{display:block;padding:10px 12px;white-space:pre;overflow-x:auto}
/* drill */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,16,.45);display:flex;justify-content:flex-end}
.dr{background:var(--bg);width:min(1100px,100%);height:100%;display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-h{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.dr-h .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dr-h .big{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.dr-b{overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60}
.ec-tip{font-family:var(--font)!important}
@media (max-width:640px){.tile .v{font-size:20px}.chart{height:240px}.brand b{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="bar">
  <div class="wrap bar-in">
    <div class="brand"><b>Alta Group · Bảng điều hành CFO–CEO</b><span id="sub">Dữ liệu từ FAST Business · xử lý ngay trong trình duyệt, không tải lên máy chủ</span></div>
    <div class="ctl">

  <nav class="tabs wrap" aria-label="Trang">

</header>

<div class="wrap"><main id="main"></main></div>
<div id="drill" hidden></div>

 if(!st){let v=0,any=false;for(const mm of D.months){if(mm>m)break;const L=D.mvCM.get(c+'|'+mm);if(!L)continue;any=true;for(const [tk,no,co] of L)if(startsAny(tk,pre))v+=no-co}return any?{v,how:'gl-no-opening'}:null}
