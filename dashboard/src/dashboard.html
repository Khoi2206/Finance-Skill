/* Layout: sticky control bar (công ty · kỳ) → tabs → bảng điều hành dạng lưới; mọi con số bấm được để truy xuất dòng gốc. */

  --seq1:#86b6ef; --seq2:#5598e7; --seq3:#2a78d6; --seq4:#1c5cab; --seq5:#104281; --nodata:#c9cfcd;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#0b7a0b; --crit-ink:#b02a2a;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1315; --surface:#171c1f; --surface-2:#1e2427; --fg:#e7ecea; --muted:#a3adb3; --faint:#76828a;
  --line:#2b3337; --accent:#79afdb; --accent-ink:#0f1315; --accent-soft:#1d2c38;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s7:#9085e9;
  --seq1:#184f95; --seq2:#1c5cab; --seq3:#2a78d6; --seq4:#5598e7; --seq5:#9ec5f4; --nodata:#3a4246;
  --good-ink:#3cc93c; --crit-ink:#ef7b7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1315; --surface:#171c1f; --surface-2:#1e2427; --fg:#e7ecea; --muted:#a3adb3; --faint:#76828a;
  --line:#2b3337; --accent:#79afdb; --accent-ink:#0f1315; --accent-soft:#1d2c38;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s7:#9085e9;
  --seq1:#184f95; --seq2:#1c5cab; --seq3:#2a78d6; --seq4:#5598e7; --seq5:#9ec5f4; --nodata:#3a4246;

<script>/* Mô hình chỉ số sản xuất Alta Plastics: nguyên văn từ file “Tổng quan sản xuất – Alta Plastics” để số liệu hai bên khớp nhau */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.AltaModel = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const DEFAULTS = {
    targetBlow: 21000,      // kg thổi / ngày
    targetCut: 15000,       // kg cắt / ngày
    skipSunday: true,       // không xét Chủ nhật khi so với định mức
    windowDays: 30,         // số ngày hiển thị / phân tích
    windowCycle: false,     // true: xem theo chu kỳ hiện tại (26 đến hôm nay) thay cho số ngày cố định
    scrapWarn: 200,         // phế vượt định mức bình quân ngày (kg) -> vàng
    scrapBad: 500,          // -> đỏ
    btpWarn: 10,            // BTP tăng % trong 7 ngày -> vàng
    btpBad: 25,             // -> đỏ
    lowCoverDays: 7,        // mã còn đủ bán dưới N ngày = sắp hết
    minMonthlyExport: 2000, // chỉ xét mã xuất TB >= N kg/tháng
    daysPerMonth: 30,       // đổi xuất TB tháng -> ngày
    ongoingDays: 2,         // máy có ghi nhận trong N ngày gần nhất = đang ngưng
    idleWarnPct: 10,        // % máy cắt không người -> vàng
    idleBadPct: 25,         // -> đỏ
    highCoverDays: 60,      // mã còn đủ bán trên N ngày = tồn cao
  };

  const N = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/\s+/g, ' ').trim();
  const dayMs = iso => { const m = iso.split('-'); return Date.UTC(+m[0], m[1] - 1, +m[2]); };
  const isoOf = ms => new Date(ms).toISOString().slice(0, 10);
  const addDays = (iso, n) => isoOf(dayMs(iso) + n * 864e5);
  const dow = iso => new Date(dayMs(iso)).getUTCDay();
  const sum = a => a.reduce((x, y) => x + y, 0);
  const H = 36e5;

  // ---------- máy ngưng ----------
  function machineInfo(raw) {
    const s = String(raw).replace(/\s+/g, ' ').trim();
    const n = N(s);
    let type = 'Khác', rest = s;
    if (/^thoi\s/.test(n)) { type = 'Thổi'; rest = s.replace(/^\S+\s+/, ''); }
    else if (/^(cat|ca)\s/.test(n)) { type = 'Cắt'; rest = s.replace(/^\S+\s+/, ''); }
    let label = type === 'Khác' ? s : type + ' ' + rest.replace(/^(\S+)/, m => m.toUpperCase());
    if (/^may (mang co|co mang)/.test(n)) label = 'Máy co màng';
    return { label, type };
  }
  function causeCat(cause, note) {
    const n = N(cause);
    if (/nhan vien|khong co nguoi|thieu nguoi|thieu cong nhan|thieu nhan/.test(n)) return 'staff';
    if (/doi hang|doi po|chuyen hang|doi mau|kiem tra|ve sinh|cho (hang|keo|nvl|cuon)|het (hang|nvl|cuon)|khong co (po|hang|cuon)/.test(n)) return 'other';
    if (/sua|\bhu\b|hong|dut|loi|driver|motor|\bmon\b|thay|plc|bien tan|ket |rach|chay |\bday\b|bao tri|long|dut/.test(n + ' ')) return 'repair';
    return 'other';
  }

  function downtime(parts, S, asOf) {
    const ev = parts.downtime && parts.downtime.events;
    if (!ev) return null;
    const endMs = dayMs(asOf) + 864e5, startMs = endMs - S.windowDays * 864e5;
    const rows = ev.map((e, i) => Object.assign({ i }, e, machineInfo(e.machine), { cat: causeCat(e.cause, e.note) }));
    let bad = 0;
    const closed = rows.filter(r => r.end != null && r.end > r.start);
    rows.forEach(r => { if (r.end != null && r.end <= r.start) { bad++; r.skip = true; } });

    // sự cố ghi lặp: dòng chưa có giờ chạy lại nhưng đã có dòng đóng cùng thời điểm
    rows.filter(r => r.end == null).forEach(r => {
      const cl = closed.find(c => c.label === r.label && c.start - 12 * H <= r.start && r.start <= c.end);
      if (cl) { r.end = cl.end; r.dup = true; }
    });
    // sự cố còn mở
    const openBy = {};
    rows.filter(r => r.end == null).forEach(r => (openBy[r.label] = openBy[r.label] || []).push(r));
    const ongoing = [], stale = [];
    for (const [label, list] of Object.entries(openBy)) {
      const lastLog = Math.max(...list.map(r => dayMs(r.date)));
      const isOn = lastLog >= endMs - S.ongoingDays * 864e5;
      const cap = isOn ? endMs : Math.min(endMs, lastLog + 864e5);
      list.forEach(r => { r.end = Math.max(cap, r.start); r.open = true; });
      const first = list.reduce((a, b) => (a.start <= b.start ? a : b));
      const latest = list.reduce((a, b) => (a.start >= b.start ? a : b));
      const info = { label, type: list[0].type, cause: latest.cause || first.cause, since: first.start, lastLog, rows: list.length, cat: latest.cat };
      if (isOn) { info.hours = (endMs - first.start) / H; ongoing.push(info); }
      else { info.daysQuiet = Math.round((endMs - lastLog - 864e5) / 864e5); info.extraHours = (endMs - cap) / H; stale.push(info); }
    }
    ongoing.sort((a, b) => a.since - b.since);
    stale.sort((a, b) => a.since - b.since);

    // gộp theo máy; đoạn thời gian chồng nhau tính một lần, thuộc về dòng ghi mới nhất
    const byM = {};
    rows.filter(r => !r.skip).forEach(r => (byM[r.label] = byM[r.label] || []).push(r));
    const dates = []; for (let i = 0; i < S.windowDays; i++) dates.push(addDays(asOf, i - S.windowDays + 1));
    const daily = dates.map(d => ({ date: d, 'Thổi': 0, 'Cắt': 0, 'Khác': 0 }));
    const dIdx = {}; dates.forEach((d, i) => (dIdx[d] = i));
    const machines = [], causeMap = {}, cats = { staff: 0, repair: 0, other: 0 }, byType = { 'Thổi': 0, 'Cắt': 0, 'Khác': 0 };
    for (const [label, list] of Object.entries(byM)) {
      const iv = list.map(r => Object.assign(r, { s: Math.max(r.start, startMs), e: Math.min(r.end, endMs) })).filter(r => r.e > r.s);
      if (!iv.length) continue;
      const b = [...new Set(iv.flatMap(r => [r.s, r.e]))].sort((x, y) => x - y);
      const m = { label, type: iv[0].type, hours: 0, cat: { staff: 0, repair: 0, other: 0 }, events: 0 };
      for (let k = 0; k < b.length - 1; k++) {
        const a = b[k], z = b[k + 1];
        const cand = iv.filter(r => r.s <= a && r.e >= z);
        if (!cand.length) continue;
        const win = cand.reduce((x, y) => (y.start > x.start || (y.start === x.start && y.i > x.i) ? y : x));
        const h = (z - a) / H;
        m.hours += h; m.cat[win.cat] += h; cats[win.cat] += h; byType[m.type] += h;
        const key = N(win.cause).slice(0, 48) || '(không ghi)';
        const c = causeMap[key] || (causeMap[key] = { text: win.cause || '(không ghi nguyên nhân)', hours: 0, cat: win.cat, machines: new Set() });
        c.hours += h; c.machines.add(label);
        for (let t = Math.floor((a - startMs) / 864e5); t * 864e5 + startMs < z && t < dates.length; t++) {
          const d0 = startMs + t * 864e5, d1 = d0 + 864e5;
          const ov = Math.min(z, d1) - Math.max(a, d0);
          if (ov > 0 && daily[t]) daily[t][m.type] += ov / H;
        }
      }
      m.events = new Set(iv.map(r => r.start)).size;
      machines.push(m);
    }
    machines.sort((a, b) => b.hours - a.hours);
    const causes = Object.values(causeMap).map(c => ({ text: c.text, hours: c.hours, cat: c.cat, machines: c.machines.size })).sort((a, b) => b.hours - a.hours);
    daily.forEach(d => (d.total = d['Thổi'] + d['Cắt'] + d['Khác']));
    return {
      startMs, endMs, total: sum(machines.map(m => m.hours)), byType, cats, machines, causes, daily,
      ongoing, stale, rowCount: rows.length, mergedDup: rows.filter(r => r.dup).length, badRows: bad,
    };
  }

  // ---------- chính ----------
  function build(parts, S0) {
    const S = Object.assign({}, DEFAULTS, S0 || {});
    const M = { S, have: {}, notes: [] };
    ['summary', 'cutplan', 'blowplan', 'downtime', '3d'].forEach(k => (M.have[k] = !!parts[k]));

    // --- sản lượng ---
    if (parts.summary) {
      const all = parts.summary.days;
      const withData = all.filter(d => d.has);
      const last = withData[withData.length - 1];
      M.asOf = last.date;
      if (S.windowCycle) {
        const [y0, mo0, d0] = M.asOf.split('-').map(Number), p2 = n => String(n).padStart(2, '0');
        const cs0 = d0 >= 26 ? `${y0}-${p2(mo0)}-26` : (mo0 === 1 ? `${y0 - 1}-12-26` : `${y0}-${p2(mo0 - 1)}-26`);
        S.windowDays = Math.max(7, Math.round((dayMs(M.asOf) - dayMs(cs0)) / 864e5) + 1);
      }
      const by = new Map(all.map(d => [d.date, d]));
      M.series = [];
      for (let i = S.windowDays - 1; i >= 0; i--) {
        const date = addDays(M.asOf, -i), d = by.get(date);
        const ok = !!(d && d.has);
        M.series.push({
          date, dow: dow(date), off: dow(date) === 0, nodata: !ok,
          blow: ok ? d.blow || 0 : 0, cut: ok ? d.cut || 0 : 0,
          btp: d && d.btp != null ? d.btp : null,
          over: d && (d.overBlow != null || d.overCut != null) ? (d.overBlow || 0) + (d.overCut || 0) : null,
          overBlow: d ? d.overBlow : null, overCut: d ? d.overCut : null,
          staffBlow: d ? d.staffBlow : null, staffCutA: d ? d.staffCutA : null, staffCutB: d ? d.staffCutB : null,
        });
      }
      M.last = M.series[M.series.length - 1];
      const isWork = d => !d.nodata && !(S.skipSunday && d.off);
      const avg = (arr, k) => { const w = arr.filter(isWork); return w.length ? sum(w.map(d => d[k])) / w.length : null; };
      const l7 = M.series.slice(-7), p7 = M.series.slice(-14, -7);
      M.avg = { blow7: avg(l7, 'blow'), cut7: avg(l7, 'cut'), blowPrev: avg(p7, 'blow'), cutPrev: avg(p7, 'cut'), blow30: avg(M.series, 'blow'), cut30: avg(M.series, 'cut') };
      M.daysBelow = {
        blow: M.series.filter(d => isWork(d) && d.blow < S.targetBlow).length,
        cut: M.series.filter(d => isWork(d) && d.cut < S.targetCut).length,
        work: M.series.filter(isWork).length,
      };
      // chu kỳ 26 -> 25
      const [y, mo, dd] = M.asOf.split('-').map(Number);
      const cs = dd >= 26 ? `${y}-${String(mo).padStart(2, '0')}-26` : (mo === 1 ? `${y - 1}-12-26` : `${y}-${String(mo - 1).padStart(2, '0')}-26`);
      const [cy, cm] = cs.split('-').map(Number);
      const ps = cm === 1 ? `${cy - 1}-12-26` : `${cy}-${String(cm - 1).padStart(2, '0')}-26`;
      const elapsed = Math.round((dayMs(M.asOf) - dayMs(cs)) / 864e5) + 1;
      const inR = (d, a, b) => d.date >= a && d.date <= b;
      const cyc = all.filter(d => inR(d, cs, M.asOf)), prv = all.filter(d => inR(d, ps, addDays(ps, elapsed - 1)));
      const agg = a => ({ blow: sum(a.map(d => d.blow || 0)), cut: sum(a.map(d => d.cut || 0)), over: sum(a.map(d => (d.overBlow || 0) + (d.overCut || 0))) });
      M.cycle = Object.assign({ start: cs, end: addDays(cs, 29), elapsed, prevStart: ps }, agg(cyc), { prev: agg(prv) });
      // BTP
      const btpDays = all.filter(d => d.btp != null && d.date <= M.asOf);
      const bl = btpDays[btpDays.length - 1];
      const ref = [...btpDays].reverse().find(d => d.date <= addDays(M.asOf, -7));
      M.btp = { value: bl ? bl.btp : null, ref: ref ? ref.btp : null };
      M.btp.delta = M.btp.value != null && M.btp.ref != null ? M.btp.value - M.btp.ref : null;
      M.btp.pct = M.btp.delta != null && M.btp.ref ? (M.btp.delta / M.btp.ref) * 100 : null;
      // phế
      const ov7 = l7.filter(d => d.over != null);
      M.scrap = { last7: sum(ov7.map(d => d.over)), avg7: ov7.length ? sum(ov7.map(d => d.over)) / ov7.length : null, cycle: M.cycle.over };
      M.scrap.badDays = M.series.filter(d => d.over != null && d.over < -S.scrapBad).length;
      M.staff = { blow: M.last.staffBlow, cutA: M.last.staffCutA, cutB: M.last.staffCutB };
      for (let i = M.series.length - 1; i >= 0; i--) {
        const d = M.series[i];
        if (d.staffBlow != null) { M.staff = { blow: d.staffBlow, cutA: d.staffCutA, cutB: d.staffCutB, date: d.date }; break; }
      }
    }

    // --- máy ngưng ---
    if (parts.downtime && M.asOf) M.down = downtime(parts, S, M.asOf);

    // --- máy cắt hôm nay ---
    if (parts.cutplan && parts.cutplan.schedule.length) {
      const sc = parts.cutplan.schedule;
      const c = { run: 0, idle: 0, maint: 0, zero: 0 };
      sc.forEach(m => { c[m.state]++; if (m.state === 'run' && !m.expected) c.zero++; });
      M.floor = { machines: sc, counts: c, total: sc.length, planDay: parts.cutplan.planDay, totals: parts.cutplan.scheduleTotals };
    }

    // --- tồn kho ---
    if (parts.cutplan && parts.cutplan.stock.length) {
      const items = parts.cutplan.stock.filter(s => s.kind === 'SX').map(s => {
        const perDay = s.tb / S.daysPerMonth;
        return Object.assign({}, s, { perDay, cover: perDay > 0 ? Math.max(0, s.stock) / perDay : null });
      });
      const risk = items.filter(s => s.tb >= S.minMonthlyExport && s.cover != null && s.cover < S.lowCoverDays).sort((a, b) => b.tb - a.tb);
      const neg = parts.cutplan.stock.filter(s => s.stock < -1);
      M.stock = {
        risk, riskCount: risk.length, negCount: neg.length, items: items.length,
        total: sum(items.map(s => Math.max(0, s.stock))), exportMonth: sum(items.map(s => s.tb)),
      };
      M.stock.cover = M.stock.exportMonth ? M.stock.total / (M.stock.exportMonth / S.daysPerMonth) : null;
      M.inv = inventory(parts.cutplan, items, risk, S);
    }

    // --- đơn hàng ---
    const cnt = (arr, key) => arr.reduce((o, x) => ((o[x[key]] = (o[x[key]] || 0) + 1), o), {});
    M.orders = {};
    if (parts.blowplan) {
      const pos = parts.blowplan.pos, st = cnt(pos, 'status');
      const open = pos.filter(p => p.status !== 'HOAN THANH TRE' && p.status !== 'HOAN THANH');
      const remain = p => Math.max(0, (p.plan || 0) - (p.actual || 0));
      const byCust = {};
      open.forEach(p => (byCust[p.cust || '(không rõ)'] = (byCust[p.cust || '(không rõ)'] || 0) + remain(p)));
      M.orders.blow = {
        total: pos.length, notStarted: st['CHUA SX'] || 0, running: st['DANG SX'] || 0,
        finishedLate: st['HOAN THANH TRE'] || 0, finishedOnTime: st['HOAN THANH'] || 0,
        remainKg: sum(open.map(remain)),
        topCust: Object.entries(byCust).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([name, kg]) => ({ name, kg })),
      };
      M.orders.blow.remainDays = M.avg && M.avg.blow7 ? M.orders.blow.remainKg / M.avg.blow7 : null;
    }
    if (parts.cutplan) {
      const pos = parts.cutplan.pos, st = cnt(pos, 'status');
      M.orders.cut = {
        total: pos.length, notStarted: st['CHUA SX'] || 0, running: st['DANG SX'] || 0, finished: st['HOAN THANH'] || 0,
        negBtp: pos.filter(p => p.status === 'DANG SX' && p.btp != null && p.btp < -50).length,
      };
    }

    // --- 3D ---
    if (parts['3d']) {
      const dd = parts['3d'].days.filter(d => d.date <= (M.asOf || '9999')).slice(-S.windowDays);
      const act = dd.filter(d => d.has);
      M.p3d = {
        days: dd, activeDays: act.length, units: sum(act.map(d => d.units || 0)), kg: sum(act.map(d => d.kg || 0)),
        staff: [...dd].reverse().map(d => d.staffTxt).find(Boolean) || '',
        last: act[act.length - 1] || null,
      };
    }

    M.status = statusCells(M);
    M.alerts = alerts(M);
    return M;
  }


  // ---------- cơ cấu tồn kho và kế hoạch thổi (hàng tự sản xuất, tính bằng kg) ----------
  function inventory(cp, items, risk, S) {
    const pos = x => Math.max(0, x || 0), dpm = S.daysPerMonth;
    const days = (kg, tb) => (tb > 0 ? kg / (tb / dpm) : null);
    const tot = { stock: 0, btp: 0, plan: 0, tb: 0 };
    const groups = {};
    items.forEach(s => {
      const g = groups[s.grp] || (groups[s.grp] = { name: s.grp, n: 0, stock: 0, btp: 0, plan: 0, tb: 0 });
      g.n++; g.stock += pos(s.stock); g.btp += pos(s.btp); g.plan += pos(s.plan); g.tb += pos(s.tb);
      tot.stock += pos(s.stock); tot.btp += pos(s.btp); tot.plan += pos(s.plan); tot.tb += pos(s.tb);
    });
    const glist = Object.values(groups).filter(g => g.stock + g.btp + g.plan + g.tb > 0).map(g => {
      g.cover = days(g.stock, g.tb); g.supply = days(g.stock + g.btp + g.plan, g.tb);
      let lv = 'good', why = 'Đủ hàng';
      if (g.tb < S.minMonthlyExport) { lv = 'info'; why = 'Ít xuất'; }
      else if (g.cover < S.lowCoverDays) { lv = g.supply < dpm ? 'bad' : 'warn'; why = g.supply < dpm ? 'Tồn thấp, kế hoạch chưa đủ' : 'Tồn thấp, có kế hoạch thổi'; }
      else if (g.cover > S.highCoverDays) { lv = 'info'; why = 'Tồn cao'; }
      g.level = lv; g.why = why;
      return g;
    }).sort((a, b) => b.stock - a.stock);
    // cơ cấu theo mức đủ bán
    const bands = [
      { id: 'low', label: 'Sắp hết (dưới ' + S.lowCoverDays + ' ngày)', kg: 0, n: 0 },
      { id: 'ok', label: S.lowCoverDays + ' đến ' + dpm + ' ngày', kg: 0, n: 0 },
      { id: 'more', label: dpm + ' đến ' + S.highCoverDays + ' ngày', kg: 0, n: 0 },
      { id: 'high', label: 'Trên ' + S.highCoverDays + ' ngày (tồn cao)', kg: 0, n: 0 },
      { id: 'none', label: 'Không có xuất 3 tháng gần nhất', kg: 0, n: 0 },
    ];
    const slow = [];
    items.forEach(s => {
      const st = pos(s.stock); if (st <= 0) return;
      const c = s.tb > 0 ? s.stock / (s.tb / dpm) : null;
      const b = c == null ? bands[4] : c < S.lowCoverDays ? bands[0] : c < dpm ? bands[1] : c < S.highCoverDays ? bands[2] : bands[3];
      b.kg += st; b.n++;
      if (b.id === 'high' || b.id === 'none') slow.push(Object.assign({}, s, { cover: c }));
    });
    slow.sort((a, b) => b.stock - a.stock);
    const slowKg = bands[3].kg + bands[4].kg;
    const cust = cp.kho ? cp.kho.cust : null;
    let custTop = null;
    if (cust && cp.kho.total > 0) {
      const top = cust.slice(0, 8), rest = cust.slice(8).reduce((a, c) => a + c.kg, 0);
      custTop = { total: cp.kho.total, rows: top.concat(rest > 0 ? [{ name: 'Các khách còn lại (' + (cust.length - 8) + ')', kg: rest, rest: true }] : []), count: cust.length, otherRows: cp.kho.otherRows };
    }
    return {
      tot, tbDay: tot.tb / dpm, groups: glist, bands, slow: slow.slice(0, 8), slowKg, slowShare: tot.stock ? slowKg / tot.stock : 0,
      days: { stock: days(tot.stock, tot.tb), btp: days(tot.btp, tot.tb), plan: days(tot.plan, tot.tb) },
      noPlanRisk: risk.filter(x => !(x.plan > 0) && !(x.btp > 0)), cust: custTop,
    };
  }

  // ---------- đèn trạng thái ----------
  const f0 = n => (n == null ? '–' : Math.round(n).toLocaleString('vi-VN'));
  const pct0 = n => (n == null ? '–' : Math.round(n) + '%');
  function levelByRatio(r) { return r == null ? 'info' : r >= 0.95 ? 'good' : r >= 0.8 ? 'warn' : 'bad'; }

  function statusCells(M) {
    const S = M.S, cells = [];
    if (M.have.summary) {
      const l = M.last, a = M.avg;
      const rb = a.blow7 / S.targetBlow, rc = a.cut7 / S.targetCut;
      cells.push({ id: 'blow', title: 'Thổi', value: f0(l.blow), unit: 'kg', level: levelByRatio(rb),
        text: `Trung bình 7 ngày ${f0(a.blow7)} kg, đạt ${pct0(rb * 100)} định mức${l.off ? ' (hôm nay là Chủ nhật, chạy giảm)' : ''}.` });
      cells.push({ id: 'cut', title: 'Cắt', value: f0(l.cut), unit: 'kg', level: levelByRatio(rc),
        text: `Trung bình 7 ngày ${f0(a.cut7)} kg, đạt ${pct0(rc * 100)} định mức${l.off ? ' (Chủ nhật, chạy giảm)' : ''}.` });
      const sc = M.scrap, over = sc.avg7 == null ? null : -sc.avg7;
      cells.push({ id: 'scrap', title: 'Phế', value: sc.last7 == null ? '–' : (sc.last7 >= 0 ? '+' : '−') + f0(Math.abs(sc.last7)), unit: 'kg / 7 ngày',
        level: over == null ? 'info' : over <= S.scrapWarn ? 'good' : over <= S.scrapBad ? 'warn' : 'bad',
        text: sc.last7 < 0 ? `Phế vượt định mức ${f0(-sc.last7)} kg trong 7 ngày; cả chu kỳ này ${f0(-sc.cycle)} kg.` : `Phế thấp hơn định mức ${f0(sc.last7)} kg trong 7 ngày.` });
      const b = M.btp;
      cells.push({ id: 'btp', title: 'Cuộn chờ cắt (BTP)', value: f0(b.value), unit: 'kg',
        level: b.pct == null ? 'info' : b.pct >= S.btpBad ? 'bad' : b.pct >= S.btpWarn ? 'warn' : 'good',
        text: b.delta == null ? 'Chưa đủ dữ liệu so sánh.' : `${b.delta >= 0 ? 'Tăng' : 'Giảm'} ${f0(Math.abs(b.delta))} kg (${b.pct >= 0 ? '+' : '−'}${Math.abs(b.pct).toFixed(0)}%) so với 7 ngày trước.` });
    }
    if (M.down) {
      const on = M.down.ongoing.length, st = M.down.stale.length;
      cells.push({ id: 'down', title: 'Máy ngưng', value: String(on), unit: 'máy đang ngưng',
        level: on >= 3 || st >= 10 ? 'bad' : on >= 1 || st >= 1 ? 'warn' : 'good',
        text: `${st} sự cố ghi ngưng nhưng chưa ghi giờ chạy lại. ${f0(M.down.total)} giờ máy ngưng trong ${M.S.windowDays} ngày.` });
    }
    if (M.floor) {
      const c = M.floor.counts, run = c.run, idleP = (c.idle / M.floor.total) * 100;
      cells.push({ id: 'floor', title: 'Máy cắt hôm nay', value: `${run}/${M.floor.total}`, unit: 'máy có lịch chạy',
        level: idleP >= S.idleBadPct ? 'bad' : idleP >= S.idleWarnPct ? 'warn' : 'good',
        text: `${c.idle} máy không có người, ${c.maint} máy bảo trì.` });
    }
    if (M.stock) {
      const r = M.stock.risk, n = r.length;
      cells.push({ id: 'stock', title: 'Mã sắp hết hàng', value: String(n), unit: `mã còn dưới ${M.S.lowCoverDays} ngày`,
        level: n >= 8 ? 'bad' : n >= 3 ? 'warn' : 'good',
        text: n ? `Xuất nhiều nhất: ${r.slice(0, 2).map(x => shortName(x.name)).join('; ')}.` : 'Không có mã xuất nhiều nào sắp hết.' });
    }
    if (M.orders.blow) {
      const o = M.orders.blow;
      cells.push({ id: 'orders', title: 'Khối lượng còn phải thổi', value: f0(o.remainKg / 1000), unit: 'tấn',
        level: 'info', text: `${o.running + o.notStarted} đơn thổi chưa xong${o.remainDays ? `, tương đương khoảng ${Math.round(o.remainDays)} ngày thổi` : ''}.` });
    }
    return cells;
  }

  function shortName(n) { return String(n).replace(/\s*\(.*$/, '').replace(/\/\d+.*$/, '').replace(/,\s*(độ dày|dày|độ).*$/i, '').slice(0, 52).trim(); }

  function alerts(M) {
    const out = [], S = M.S;
    const add = (level, text, key) => out.push({ level, text, key });
    if (M.have.summary) {
      const a = M.avg;
      if (a.cut7 / S.targetCut < 0.95) add(a.cut7 / S.targetCut < 0.8 ? 'bad' : 'warn', `Cắt 7 ngày qua trung bình ${f0(a.cut7)} kg/ngày, thấp hơn định mức ${f0(S.targetCut)} kg.`, 'cut');
      if (a.blow7 / S.targetBlow < 0.95) add(a.blow7 / S.targetBlow < 0.8 ? 'bad' : 'warn', `Thổi 7 ngày qua trung bình ${f0(a.blow7)} kg/ngày, thấp hơn định mức ${f0(S.targetBlow)} kg.`, 'blow');
      if (M.btp.pct != null && M.btp.pct >= S.btpWarn) add(M.btp.pct >= S.btpBad ? 'bad' : 'warn', `Cuộn chờ cắt tăng ${M.btp.pct.toFixed(0)}% trong 7 ngày: cắt chưa theo kịp thổi.`, 'btp');
      if (M.scrap.avg7 != null && -M.scrap.avg7 > S.scrapWarn) add(-M.scrap.avg7 > S.scrapBad ? 'bad' : 'warn', `Phế vượt định mức bình quân ${f0(-M.scrap.avg7)} kg/ngày trong 7 ngày qua.`, 'scrap');
    }
    if (M.floor && M.floor.counts.idle) {
      const ids = M.floor.machines.filter(m => m.state === 'idle').map(m => m.machine);
      add(M.floor.counts.idle / M.floor.total * 100 >= S.idleBadPct ? 'bad' : 'warn', `${M.floor.counts.idle}/${M.floor.total} máy cắt không có người vận hành hôm nay (${ids.slice(0, 6).join(', ')}${ids.length > 6 ? '…' : ''}).`, 'idle');
    }
    if (M.down) {
      const staff = M.down.stale.filter(s => s.cat === 'staff');
      if (M.down.stale.length) add('warn', `${M.down.stale.length} máy có sự cố chưa ghi giờ chạy lại${staff.length ? `, trong đó ${staff.length} máy ghi “thiếu nhân viên”` : ''}. Cần bộ phận sản xuất xác nhận máy đã chạy lại chưa.`, 'stale');
      if (M.down.ongoing.length) add(M.down.ongoing.some(o => o.type !== 'Khác') ? 'bad' : 'warn', `Đang ngưng: ${M.down.ongoing.slice(0, 4).map(o => o.label).join(', ')}${M.down.ongoing.length > 4 ? '…' : ''}.`, 'ongoing');
    }
    if (M.stock && M.stock.risk.length) {
      add(M.stock.risk.length >= 8 ? 'bad' : 'warn', `${M.stock.risk.length} mã xuất nhiều sắp hết trong ${S.lowCoverDays} ngày; nhiều nhất: ${M.stock.risk.slice(0, 3).map(x => shortName(x.name)).join('; ')}.`, 'stock');
    }
    if (M.inv) {
      const np = M.inv.noPlanRisk;
      if (np.length) add(np.length >= 5 ? 'bad' : 'warn', `${np.length} mã sắp hết hàng nhưng chưa có kế hoạch thổi và không có cuộn chờ cắt${np.length ? `; xuất nhiều nhất: ${np.slice(0, 2).map(x => shortName(x.name)).join('; ')}` : ''}.`, 'noplan');
      if (M.inv.slowShare >= 0.25) add('info', `${f0(M.inv.slowKg / 1000)} tấn tồn (${Math.round(M.inv.slowShare * 100)}% tổng tồn) nằm ở mã không xuất hoặc còn đủ bán trên ${S.highCoverDays} ngày.`, 'slow');
    }
    return out.sort((a, b) => ({ bad: 0, warn: 1, info: 2, good: 3 }[a.level] - { bad: 0, warn: 1, info: 2, good: 3 }[b.level]));
  }

  return { DEFAULTS, build, addDays, dayMs, isoOf, dow, f0, shortName };
});

</script>
<script>
"use strict";
/* ============================================================ hằng số */
const CO=['ALTA · Công ty mẹ','PLASTIC · Alta Plastic','MEDIA · Alta Media'], COS=['ALTA','PLASTIC','MEDIA'];
