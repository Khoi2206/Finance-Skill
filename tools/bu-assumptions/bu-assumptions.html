<title>Giả định Ngân sách 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sổ ngân sách — thanh đầu cố định, cột trái chọn BU theo pháp nhân, vùng chính là biểu mẫu/bảng tổng hợp dạng sổ cái */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --ink:#132228; --muted:#566a70; --line:#d6e0e1; --soft:#e5eff0;
  --accent:#0d6170; --accent-ink:#ffffff;
  --st-none:#7d8c90; --st-draft:#2f68b0; --st-sub:#6a4bb8; --st-ret:#c2410c; --st-ok:#1d7a4b;
  --good:#1d7a4b; --warn:#a86400; --bad:#b42318; --sample:#8a5a00;
  --f-display:"Be Vietnam Pro",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#152023; --ink:#e2ebed; --muted:#93a6aa; --line:#29393d; --soft:#1b2c30;
  --accent:#58b6c2; --accent-ink:#0b1416;
  --st-none:#8e9da1; --st-draft:#7aa7e8; --st-sub:#a993ec; --st-ret:#f08a57; --st-ok:#5cc58f;
  --good:#5cc58f; --warn:#e5a83b; --bad:#f2786b; --sample:#e5b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#152023; --ink:#e2ebed; --muted:#93a6aa; --line:#29393d; --soft:#1b2c30;
  --accent:#58b6c2; --accent-ink:#0b1416;
  --st-none:#8e9da1; --st-draft:#7aa7e8; --st-sub:#a993ec; --st-ret:#f08a57; --st-ok:#5cc58f;
  --good:#5cc58f; --warn:#e5a83b; --bad:#f2786b; --sample:#e5b45a; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
[hidden]{display:none!important}
td:has(> input[type=number]){text-align:right}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.15rem;font-weight:700}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:.92rem;font-weight:600}
.num,td.n,th.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.toprow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.spacer{flex:1}
.viewer{display:flex;align-items:center;gap:8px;font-size:.85rem}
.viewer img{width:26px;height:26px;border-radius:50%}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.role{border-color:var(--accent);color:var(--accent)}

.banner{padding-block:7px;font-size:.84rem;border-bottom:1px solid var(--line)}
.banner.sample{background:color-mix(in srgb,var(--sample) 14%,var(--surface));color:var(--ink)}
.banner.sample b{color:var(--sample)}
.banner.info{background:var(--soft)}
.banner .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

main{padding-block:18px 48px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:14px 16px}
.section{display:flex;flex-direction:column;gap:10px;padding:16px;border-top:1px solid var(--line)}
.section:first-child{border-top:0}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.sechead p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}

.bulist{display:flex;flex-direction:column;gap:12px;padding:12px}
.bulist .grp{display:flex;flex-direction:column;gap:3px}
.bulist button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;padding:6px 8px;border-radius:7px;cursor:pointer}
.bulist button:hover{background:var(--soft)}
.bulist button[aria-current="true"]{background:var(--soft);border-color:var(--accent)}
.bulist .code{font-family:var(--f-num);font-size:.7rem;color:var(--muted)}
@media (max-width:860px){.bulist{flex-direction:row;flex-wrap:wrap}.bulist .grp{flex:1 1 220px}}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.st-none{--c:var(--st-none)} .st-draft{--c:var(--st-draft)} .st-submitted{--c:var(--st-sub)} .st-returned{--c:var(--st-ret)} .st-approved{--c:var(--st-ok)}

.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:.85rem;padding:7px 13px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
.btn.ghost:hover:not(:disabled){color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.72rem;font-weight:600;color:var(--muted);background:var(--soft);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:color-mix(in srgb,var(--soft) 55%,var(--surface))}
tr.grp td{background:var(--soft);font-weight:600;font-size:.78rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
input:disabled,select:disabled,textarea:disabled{background:var(--soft);color:var(--muted)}
input[type=number]{font-family:var(--f-num);text-align:right;width:92px}
input.w-name{width:190px} input.w-unit{width:90px} input.w-s{width:70px}
textarea{width:100%;min-height:62px;resize:vertical}
td input,td select{width:100%}
td input[type=number]{width:88px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:500}
.fields{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}

.msg{padding:9px 12px;border-radius:8px;font-size:.85rem;border:1px solid var(--line);background:var(--soft)}
.msg.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.msg.bad{border-color:color-mix(in srgb,var(--bad) 50%,var(--line));background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.msg.ok{border-color:color-mix(in srgb,var(--good) 50%,var(--line));background:color-mix(in srgb,var(--good) 9%,var(--surface))}
.msg p{margin:.2em 0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-num);font-size:1.1rem;font-weight:500}

.var-good{color:var(--good);font-weight:600} .var-warn{color:var(--warn);font-weight:600} .var-bad{color:var(--bad);font-weight:600}
td.cell-good{background:color-mix(in srgb,var(--good) 11%,transparent)}
td.cell-warn{background:color-mix(in srgb,var(--warn) 13%,transparent)}
td.cell-bad{background:color-mix(in srgb,var(--bad) 12%,transparent)}

.conf{display:flex;gap:6px;flex-wrap:wrap}
.conf label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:.84rem}
.conf input{width:auto}
.empty{display:flex;flex-direction:column;gap:10px;padding:22px 18px}
.empty ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;max-width:65ch}
pre.out{font-family:var(--f-num);font-size:.75rem;max-height:220px;overflow:auto;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;white-space:pre}
.reviewbox{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--soft);border-radius:8px}
.hist{margin:0;padding-left:1.1em;font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap toprow">
    <div class="brand">
      <span class="eyebrow">Alta Group · Mùa ngân sách 2027</span>
      <h1>Giả định Ngân sách 2027</h1>
    </div>
    <div class="tabs" role="tablist">
      <button id="tab-bu" role="tab" aria-selected="true" data-tab="bu">Trang BU</button>
      <button id="tab-cfo" role="tab" aria-selected="false" data-tab="cfo">Tổng hợp CFO</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="demoToggle" type="button">Xem dữ liệu mẫu</button>
    <div class="viewer" id="viewer"><span class="chip">Đang nhận diện người xem…</span></div>
  </div>
  <div class="banner info" id="connBanner"><div class="wrap"><span id="connText">Đang kết nối kho dữ liệu dùng chung…</span></div></div>
  <div class="banner sample" id="sampleBanner" hidden><div class="wrap"><span><b>DỮ LIỆU MẪU</b> — số liệu minh họa, không phải số của Alta. Mọi thay đổi trong chế độ này chỉ nằm trên màn hình của bạn và không được lưu.</span><button class="btn" type="button" id="demoExit">Thoát chế độ mẫu</button></div></div>
</header>

<main class="wrap">
  <section id="view-bu" class="layout">
    <nav class="panel" aria-label="Chọn BU"><div class="bulist" id="buList"></div></nav>
    <div class="panel" id="buForm"></div>
  </section>
  <section id="view-cfo" class="stack" hidden></section>
</main>

<script>
(() => {
"use strict";
const YEAR = 2027;
const SOC = 1.215; // hệ số chi phí lương DN (lương + BHXH/BHYT/BHTN/KPCĐ ~21,5%) — cần xác nhận
const ENTITIES = [
  {code:"ALTA", name:"Alta (Mẹ)"},
  {code:"APL",  name:"Alta Plastic"},
  {code:"AME",  name:"Alta Media"},
];
const BUS = [
  {code:"ALTA-RENT", co:"ALTA", name:"Cho thuê mặt bằng", unit:"m²·tháng", hint:"Sản lượng = diện tích cho thuê × số tháng; giá = đơn giá thuê (tr đ/m²/tháng)."},
  {code:"ALTA-TECH", co:"ALTA", name:"Thiết bị & dự án công nghệ", unit:"dự án", hint:"Sản lượng = số dự án/hợp đồng; giá = giá trị bình quân mỗi dự án."},
  {code:"ALTA-BAG",  co:"ALTA", name:"Thương mại túi bao bì", unit:"nghìn túi", hint:"Sản lượng theo nghìn túi; giá = tr đ/nghìn túi."},
  {code:"APL-PACK",  co:"APL",  name:"Bao bì nhựa", unit:"tấn", hint:"Sản lượng (tấn) × giá bán (tr đ/tấn). Biên gộp phụ thuộc giá hạt nhựa giả định."},
  {code:"APL-RESIN", co:"APL",  name:"Thương mại hạt nhựa", unit:"tấn", hint:"Sản lượng (tấn) × giá bán (tr đ/tấn)."},
  {code:"APL-3D",    co:"APL",  name:"In 3D", unit:"đơn hàng", hint:"Sản lượng = số đơn hàng/sản phẩm; chưa phân bổ chi phí chung."},
  {code:"AME-LED",   co:"AME",  name:"LED", unit:"slot·tháng", hint:"Sản lượng = số slot × số tháng × tỷ lệ lấp đầy; giá = tr đ/slot/tháng."},
  {code:"AME-BA",    co:"AME",  name:"BA — Thiết bị, giải pháp", unit:"dự án", hint:"Sản lượng = số dự án; giá = giá trị bình quân/dự án."},
  {code:"AME-TTB",   co:"AME",  name:"TTB — Cho thuê hệ thống đa phương tiện", unit:"sự kiện", hint:"Sản lượng = số sự kiện/hợp đồng thuê; giá = tr đ/sự kiện."},
  {code:"AME-DVK",   co:"AME",  name:"DVK — Dịch vụ, chia doanh thu", unit:"hợp đồng", hint:"Doanh thu theo phần được chia; nhập sản lượng = số hợp đồng, giá = doanh thu bình quân."},
  {code:"AME-TKL",   co:"AME",  name:"TKL — Phần mềm, thiết kế", unit:"gói", hint:"Sản lượng = số gói/hợp đồng; giá = tr đ/gói."},
];
const BU = Object.fromEntries(BUS.map(b => [b.code, b]));
const ST = {
  none:{label:"Chưa bắt đầu", cls:"st-none"},
  draft:{label:"Nháp", cls:"st-draft"},
  submitted:{label:"Đã nộp", cls:"st-submitted"},
  returned:{label:"Trả lại", cls:"st-returned"},
  approved:{label:"Đã duyệt", cls:"st-approved"},
};
const LINES = ["revenue","cogs","gross_profit","payroll","opex","contribution","capex","headcount"];
const LINE_VI = {revenue:"Doanh thu",cogs:"Giá vốn",gross_profit:"Lãi gộp",payroll:"Chi phí nhân sự",opex:"Chi phí hoạt động chính",contribution:"Đóng góp (lãi gộp − nhân sự − chi phí)",capex:"Capex",headcount:"Nhân sự (người)"};

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const fmt = (n, d=0) => (Number.isFinite(n) ? n : 0).toLocaleString("vi-VN", {maximumFractionDigits:d, minimumFractionDigits:0});
const pct = (n, d=1) => Number.isFinite(n) ? (n*100).toLocaleString("vi-VN",{maximumFractionDigits:d, minimumFractionDigits:d}) + "%" : "—";
const when = ts => ts ? new Date(ts).toLocaleString("vi-VN", {dateStyle:"short", timeStyle:"short"}) : "—";
const uid = () => Math.random().toString(36).slice(2, 9);
const periods = g => g === "M" ? Array.from({length:12}, (_, i) => "T" + (i+1)) : ["Q1","Q2","Q3","Q4"];
const zeros = n => Array(n).fill(0);
const sum = a => a.reduce((s, x) => s + num(x), 0);
const store = {
  get(k){ try { return localStorage.getItem("bua27:" + k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem("bua27:" + k, v); } catch {} },
};

// ---------- state ----------
const S = {
  tab: "bu", bu: "ALTA-RENT",
  demo: false, db: null, user: null, me: null,
  isAdmin: false, canWrite: null, writeRefused: false,
  live: {docs:{}, reviews:{}, guidance:null}, demoData: null,
  connected: false, loadedOnce: false,
  draft: null, draftFor: null, baseSavedAt: null, dirty: false, remoteChanged: false,
  saving: false, formMsg: null, reviewOpen: null, exportGran: "M", onlyFinal: false, exportText: "",
  guidanceDraft: null,
};
const D = () => S.demo ? S.demoData : S.live;

function statusOf(code){
  const d = D().docs[code], r = D().reviews[code];
  if (!d) return "none";
  if (d.status === "submitted") return (r && r.forSubmittedAt === d.submittedAt) ? r.decision : "submitted";
  if (r && r.decision === "returned" && d.lastSubmittedAt && r.forSubmittedAt === d.lastSubmittedAt) return "returned";
  return "draft";
}
const pill = st => `<span class="pill ${ST[st].cls}">${ST[st].label}</span>`;

// ---------- model ----------
function emptyDoc(code){
  const n = 4;
  return {
    bu: code, company: BU[code].co, granularity: "Q", status: "draft",
    revenue: [{id:uid(), kind:"Khách hàng lớn", name:"", unit:BU[code].unit, price:0, gm:0, vol:zeros(n)}],
    headcount: [{id:uid(), dept:"", salary:0, hc:zeros(n)}],
    opex: [{id:uid(), name:"", amt:zeros(n)}],
    capex: [],
    risks: [],
    confidence: 0, confidenceNote: "", notes: "",
  };
}
function normalize(doc, code){
  const d = Object.assign(emptyDoc(code), clone(doc || {}));
  const n = d.granularity === "M" ? 12 : 4;
  const fix = a => { const r = Array.isArray(a) ? a.slice(0, n).map(num) : []; while (r.length < n) r.push(0); return r; };
  d.revenue = (d.revenue||[]).map(x => ({id:x.id||uid(), kind:x.kind||"Khách hàng lớn", name:x.name||"", unit:x.unit||"", price:num(x.price), gm:num(x.gm), vol:fix(x.vol)}));
  d.headcount = (d.headcount||[]).map(x => ({id:x.id||uid(), dept:x.dept||"", salary:num(x.salary), hc:fix(x.hc)}));
  d.opex = (d.opex||[]).map(x => ({id:x.id||uid(), name:x.name||"", amt:fix(x.amt)}));
  d.capex = (d.capex||[]).map(x => ({id:x.id||uid(), item:x.item||"", amount:num(x.amount), month:Math.min(12, Math.max(1, num(x.month)||1)), note:x.note||""}));
  d.risks = (d.risks||[]).map(x => ({id:x.id||uid(), type:x.type==="Cơ hội"?"Cơ hội":"Rủi ro", desc:x.desc||"", impact:num(x.impact), prob:x.prob||"Trung bình"}));
  return d;
}
function convertGran(d, to){
  if (d.granularity === to) return;
  const flowQM = a => a.flatMap(v => [v/3, v/3, v/3]);
  const stockQM = a => a.flatMap(v => [v, v, v]);
  const flowMQ = a => [0,1,2,3].map(q => a[q*3] + a[q*3+1] + a[q*3+2]);
  const stockMQ = a => [0,1,2,3].map(q => a[q*3+2]);
  const r = x => Math.round(x * 1000) / 1000;
  const toM = to === "M";
  d.revenue.forEach(x => x.vol = (toM ? flowQM(x.vol) : flowMQ(x.vol)).map(r));
  d.headcount.forEach(x => x.hc = (toM ? stockQM(x.hc) : stockMQ(x.hc)).map(r));
  d.opex.forEach(x => x.amt = (toM ? flowQM(x.amt) : flowMQ(x.amt)).map(r));
  d.granularity = to;
}
// Tính chuỗi số theo kỳ của chính BU (tháng hoặc quý), đơn vị tr đ.
function compute(d){
  const n = d.granularity === "M" ? 12 : 4, mp = d.granularity === "M" ? 1 : 3;
  const rev = zeros(n), gp = zeros(n), pay = zeros(n), opex = zeros(n), hc = zeros(n), cap = zeros(n), capM = zeros(12);
  d.revenue.forEach(x => x.vol.forEach((v, p) => { const r = num(v) * num(x.price); rev[p] += r; gp[p] += r * num(x.gm) / 100; }));
  d.headcount.forEach(x => x.hc.forEach((v, p) => { hc[p] += num(v); pay[p] += num(v) * num(x.salary) * mp * SOC; }));
  d.opex.forEach(x => x.amt.forEach((v, p) => opex[p] += num(v)));
  d.capex.forEach(x => { const m = Math.min(12, Math.max(1, num(x.month)||1)); capM[m-1] += num(x.amount); cap[n === 12 ? m-1 : Math.floor((m-1)/3)] += num(x.amount); });
  const cogs = rev.map((r, p) => r - gp[p]);
  const contrib = gp.map((g, p) => g - pay[p] - opex[p]);
  const T = {rev:sum(rev), gp:sum(gp), pay:sum(pay), opex:sum(opex), cap:sum(cap), contrib:sum(contrib), hcEnd:hc[n-1]};
  T.gm = T.rev ? T.gp / T.rev : NaN;
  const riskUp = sum(d.risks.filter(r => r.type === "Cơ hội").map(r => r.impact));
  const riskDn = sum(d.risks.filter(r => r.type === "Rủi ro").map(r => r.impact));
  return {n, rev, gp, cogs, pay, opex, contrib, cap, capM, hc, T, riskUp, riskDn};
}
function seriesTo(arr, n, gran, kind){
  if (gran === "M") {
    if (n === 12) return arr.slice();
    return arr.flatMap(v => kind === "stock" ? [v, v, v] : [v/3, v/3, v/3]);
  }
  if (n === 4) return arr.slice();
  return [0,1,2,3].map(q => kind === "stock" ? arr[q*3+2] : arr[q*3] + arr[q*3+1] + arr[q*3+2]);
}

async function hydrateNames(root){
  const els = [...(root || document).querySelectorAll("[data-uid]")];
  const ids = [...new Set(els.map(e => e.dataset.uid).filter(i => !i.startsWith("demo:")))];
  if (!ids.length) return;

function updateCalc(){
  const d = S.draft, c = compute(d), mp = d.granularity === "M" ? 1 : 3, F = $("#buForm");
  const set = (k, v) => { const e = F.querySelector(`[data-calc="${k}"]`); if (e) e.textContent = v; };
  d.revenue.forEach((x, i) => set("rev." + i, fmt(sum(x.vol) * num(x.price))));
  c.rev.forEach((v, p) => set("revp." + p, fmt(v)));
  set("revT", fmt(c.T.rev));
  d.headcount.forEach((x, i) => set("pay." + i, fmt(sum(x.hc) * num(x.salary) * mp * SOC)));
  d.opex.forEach((x, i) => set("opex." + i, fmt(sum(x.amt))));
  const g = guidanceFor(BU[S.bu].co);
  const gmCls = g && Number.isFinite(c.T.gm) ? (c.T.gm*100 >= g.gm ? "var-good" : (g.gm - c.T.gm*100 <= 2 ? "var-warn" : "var-bad")) : "";
  const box = F.querySelector("#buSummary");
  if (box) box.innerHTML = `<h3>Tóm tắt BU (tự tính)</h3><div class="kpis">
    <div class="kpi"><span class="eyebrow">Doanh thu</span><span class="v">${fmt(c.T.rev)}</span><span class="muted small">tr đ</span></div>
    <div class="kpi"><span class="eyebrow">Biên gộp</span><span class="v ${gmCls}">${pct(c.T.gm)}</span><span class="muted small">${g ? `mục tiêu pháp nhân ${fmt(g.gm,1)}%` : "lãi gộp " + fmt(c.T.gp) + " tr đ"}</span></div>
    <div class="kpi"><span class="eyebrow">Chi phí nhân sự</span><span class="v">${fmt(c.T.pay)}</span><span class="muted small">${fmt(c.T.hcEnd)} người cuối năm</span></div>
    <div class="kpi"><span class="eyebrow">Đóng góp</span><span class="v">${fmt(c.T.contrib)}</span><span class="muted small">lãi gộp − nhân sự − chi phí chính</span></div>
    <div class="kpi"><span class="eyebrow">Capex</span><span class="v">${fmt(c.T.cap)}</span><span class="muted small">tr đ, ${d.capex.length} hạng mục</span></div>
    <div class="kpi"><span class="eyebrow">Rủi ro / cơ hội</span><span class="v">${fmt(c.riskDn)} / +${fmt(c.riskUp)}</span><span class="muted small">tr đ, ngoài kế hoạch</span></div></div>`;
}
function setPath(obj, path, val){
  const ks = path.split("."); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = val;
}
function validate(d){
  const e = [];
  const revOk = d.revenue.filter(x => x.name.trim() && sum(x.vol) * num(x.price) > 0);
  if (!revOk.length) e.push("Cần ít nhất một dòng doanh thu có tên, sản lượng và đơn giá.");
  if (d.revenue.some(x => (sum(x.vol) || x.price) && !x.name.trim())) e.push("Có dòng doanh thu chưa đặt tên khách hàng/nhóm sản phẩm.");
  if (d.revenue.some(x => x.gm < 0 || x.gm > 100)) e.push("Biên gộp phải nằm trong 0–100%.");
  if (d.capex.some(x => !x.item.trim() || x.amount <= 0)) e.push("Mỗi hạng mục capex cần tên và số tiền lớn hơn 0.");
  if (!d.confidence) e.push("Chọn mức độ tự tin (1–5).");
  return e;
}
function cleanDoc(d){
  const o = clone(d);
  o.revenue = o.revenue.filter(x => x.name.trim() || sum(x.vol) || x.price);
  o.headcount = o.headcount.filter(x => x.dept.trim() || sum(x.hc) || x.salary);
  o.opex = o.opex.filter(x => x.name.trim() || sum(x.amt));
  o.risks = o.risks.filter(x => x.desc.trim() || x.impact);
  return o;
}
async function writeBu(code, body){
  if (S.demo) { S.demoData.docs[code] = clone(body); return; }
  await S.db.doc("bu/" + code).set(body);
}
async function saveBu(kind){
  if (S.saving) return;
  const prev = D().docs[S.bu];
  const now = Date.now();
  let body;
  if (kind === "withdraw") { body = Object.assign(clone(prev), {status:"draft", savedAt:now, editedBy: meId()}); }
  else {
    const d = cleanDoc(S.draft);
    if (kind === "submit") {
      const errs = validate(S.draft);
      if (errs.length) { S.formMsg = {cls:"bad", html:"<p><b>Chưa nộp được:</b></p>" + errs.map(x => `<p>• ${esc(x)}</p>`).join("")}; renderBU(); return; }
    }
    body = Object.assign(d, {bu:S.bu, company:BU[S.bu].co, savedAt:now, editedBy: meId(),
      status: kind === "submit" ? "submitted" : "draft",
      submittedAt: kind === "submit" ? now : (prev && prev.submittedAt) || null,
      lastSubmittedAt: kind === "submit" ? now : (prev && prev.lastSubmittedAt) || null});
  }
  S.saving = true; renderBU();
  try {
    await writeBu(S.bu, body);
    S.formMsg = {cls:"ok", html: kind === "submit" ? "<p>Đã nộp cho CFO. CFO sẽ duyệt hoặc trả lại kèm bình luận.</p>" : kind === "withdraw" ? "<p>Đã rút lại. Sửa xong bấm Nộp cho CFO.</p>" : `<p>Đã lưu nháp lúc ${when(now)}.</p>`};
    S.draftFor = null; // nạp lại từ bản vừa lưu
  } catch (err) {
    if (err && err.code === "invalid_argument") { S.writeRefused = true; S.formMsg = {cls:"bad", html:"<p>Không lưu được: tài khoản của bạn chỉ có quyền xem. Nhờ CFO chia sẻ ở mức Contributor (đóng góp).</p>"}; }
    else if (err && err.code === "quota_exceeded") S.formMsg = {cls:"bad", html:"<p>Kho dữ liệu đã đầy. Báo CFO dọn bớt dữ liệu cũ.</p>"};
    else S.formMsg = {cls:"bad", html:`<p>Chưa lưu được (${esc(err && err.code || "lỗi")}). Thử lại sau ít giây; dữ liệu đang nhập vẫn còn trên màn hình.</p>`};
  }
  S.saving = false;
  renderChrome(); renderBU();
}
const meId = () => S.demo ? "demo:Bạn (chế độ mẫu)" : (S.me && S.me.id) || null;

function included(code){
  const st = statusOf(code);
  if (st === "none") return false;
  if (S.onlyFinal) return st === "submitted" || st === "approved";
  return true;
}
function entityAgg(){
  const out = {};
  ENTITIES.forEach(e => out[e.code] = {rev:0, gp:0, cap:0, pay:0, opex:0, contrib:0, hc:0, nIn:0, nAll:0});
  BUS.forEach(b => {
    out[b.co].nAll++;
    if (!included(b.code)) return;
    const c = compute(normalize(D().docs[b.code], b.code)), a = out[b.co];
    a.rev += c.T.rev; a.gp += c.T.gp; a.cap += c.T.cap; a.pay += c.T.pay; a.opex += c.T.opex; a.contrib += c.T.contrib; a.hc += c.T.hcEnd; a.nIn++;
  });
  return out;
}
function varRev(actual, target){ if (!target) return ""; const r = actual / target - 1; return r >= 0 ? "good" : (r >= -0.05 ? "warn" : "bad"); }
function varGm(gm, t){ if (t == null || !Number.isFinite(gm)) return ""; const dd = gm*100 - t; return dd >= 0 ? "good" : (dd >= -2 ? "warn" : "bad"); }
function varCap(cap, cap0){ if (!cap0) return ""; return cap > cap0 ? "bad" : (cap > cap0 * 0.9 ? "warn" : "good"); }

    ${!G ? `<p class="muted small" style="margin:0">Chưa có định hướng top-down nên chưa so sánh được. Nhập ở mục cuối trang.</p>` : ""}</div></div>`);

  // export
  P.push(`<div class="panel"><div class="section"><div class="sechead"><h2>Xuất sang mô hình ngân sách</h2><p class="muted small">Định dạng dài, cột <span class="num">company, bu, ${S.exportGran === "M" ? "month" : "quarter"}, line, amount</span> (tr đ; riêng headcount là số người). BU nhập theo quý sẽ được chia đều 3 tháng khi xuất theo tháng.</p></div>
    <div class="btnrow"><label class="f">Kỳ<select id="exportGran"><option value="M" ${S.exportGran==="M"?"selected":""}>Theo tháng</option><option value="Q" ${S.exportGran==="Q"?"selected":""}>Theo quý</option></select></label>
      <button class="btn primary" type="button" data-copy="tsv">Sao chép bảng (TSV, dán vào Excel)</button><button class="btn" type="button" data-copy="csv">Sao chép CSV</button><span class="muted small" id="copyMsg"></span></div>
    <pre class="out" id="exportOut" tabindex="0"></pre></div></div>`);

  // guidance form
  const gd = S.guidanceDraft || clone(G || {message:"", deadline:"", entities:{}});
  S.guidanceDraft = gd;
  const canG = S.demo || S.isAdmin, gdis = canG ? "" : "disabled";
  P.push(`<div class="panel"><div class="section"><div class="sechead"><h2>Định hướng top-down của CFO</h2><span class="muted small">${G && G.at ? `Cập nhật ${when(G.at)} bởi ${nameSpan(G.by)}` : "Chưa gửi"}</span></div>
    <p class="muted small" style="margin:0">Trưởng BU thấy định hướng này ở đầu biểu mẫu. Doanh thu mục tiêu = ước thực hiện 2026 × (1 + tăng trưởng).</p>
    <div class="tblwrap"><table><thead><tr><th>Pháp nhân</th><th class="n">Ước TH 2026 doanh thu (tr đ)</th><th class="n">Tăng trưởng mục tiêu %</th><th class="n">Biên gộp mục tiêu %</th><th class="n">Trần capex (tr đ)</th></tr></thead><tbody>
    ${ENTITIES.map(e => { const x = (gd.entities && gd.entities[e.code]) || {}; return `<tr><td>${esc(e.name)}</td>${["base","growth","gm","capexCap"].map(k => `<td class="n"><input type="number" step="any" data-g="${e.code}.${k}" value="${x[k] ?? ""}" ${gdis} style="width:120px"></td>`).join("")}</tr>`; }).join("")}
    </tbody></table></div>
    <div class="fields"><label class="f">Hạn nộp<input type="date" id="gDeadline" value="${esc(gd.deadline || "")}" ${gdis}></label></div>
    <label class="f">Thông điệp gửi các BU<textarea id="gMessage" ${gdis}>${esc(gd.message || "")}</textarea></label>
    ${canG ? `<div class="btnrow"><button class="btn primary" type="button" data-act="saveGuidance">Lưu & gửi định hướng</button><span class="muted small" id="gMsg"></span></div>` : `<p class="muted small" style="margin:0">Chỉ CFO sửa được mục này.</p>`}</div></div>`);

  V.innerHTML = P.join("");
  refreshExport();
  hydrateNames(V);
}
function exportRows(gran){
  const rows = [];
  const lbl = p => gran === "M" ? `${YEAR}-${String(p+1).padStart(2,"0")}` : `${YEAR}-Q${p+1}`;
  BUS.forEach(b => {
    if (!included(b.code)) return;
    const c = compute(normalize(D().docs[b.code], b.code));
    const series = {
      revenue:[c.rev,"flow"], cogs:[c.cogs,"flow"], gross_profit:[c.gp,"flow"], payroll:[c.pay,"flow"], opex:[c.opex,"flow"], contribution:[c.contrib,"flow"], headcount:[c.hc,"stock"],
    };
    LINES.forEach(line => {
      const arr = line === "capex" ? seriesTo(c.capM, 12, gran, "flow") : seriesTo(series[line][0], c.n, gran, series[line][1]);
      arr.forEach((v, p) => { if (Math.abs(v) > 1e-9) rows.push([b.co, b.code, lbl(p), line, Math.round(v * 1000) / 1000]); });
    });
  });
  return rows;
}
function exportText(kind){
  const header = ["company","bu", S.exportGran === "M" ? "month" : "quarter", "line", "amount"];
  const rows = exportRows(S.exportGran);
  const sep = kind === "csv" ? "," : "\t";
  return [header, ...rows].map(r => r.join(sep)).join("\n");
}
function refreshExport(){
  const out = $("#exportOut"); if (!out) return;
  const t = exportText("tsv"), lines = t.split("\n");
  out.textContent = lines.length > 1 ? lines.slice(0, 40).join("\n") + (lines.length > 40 ? `\n… (${lines.length - 1} dòng dữ liệu)` : "") : "Chưa có BU nào để xuất.";
}
async function copyText(text, msgEl){
  try { await navigator.clipboard.writeText(text); msgEl.textContent = `Đã sao chép ${text.split("\n").length - 1} dòng. Dán vào ô A1 của sheet nhập liệu.`; }
  catch {
    const out = $("#exportOut"); out.textContent = text;
    const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    msgEl.textContent = "Trình duyệt chặn sao chép tự động; toàn bộ bảng đã được bôi đen, bấm Ctrl/Cmd+C.";
  }
}
async function decide(code, decision){
  const cm = ($("#reviewComment") || {}).value || "";
  if (decision === "returned" && !cm.trim()) { $("#reviewComment").focus(); $("#reviewComment").placeholder = "Cần ghi bình luận khi trả lại."; return; }
  const doc = D().docs[code], old = D().reviews[code] || {};
  const at = Date.now(), by = meId();
  const body = {decision, comment:cm.trim(), at, by, forSubmittedAt: doc.submittedAt || doc.lastSubmittedAt || null,
    history:[...(old.history || []).slice(-19), {decision, comment:cm.trim(), at, by}]};
  try {
    if (S.demo) S.demoData.reviews[code] = body; else await S.db.doc("review/" + code).set(body);
    S.reviewOpen = null; if (S.draftFor === code) S.draftFor = null;
  } catch (err) { alertInline(`Không lưu được quyết định (${esc(err && err.code || "lỗi")}).`); }
  renderChrome(); renderCFO();
}
function alertInline(html){ const m = $("#copyMsg") || $("#gMsg"); if (m) m.innerHTML = html; }
async function saveGuidance(){
  const gd = S.guidanceDraft; const m = $("#gMsg");
  gd.message = $("#gMessage").value; gd.deadline = $("#gDeadline").value;
  const body = {message:gd.message, deadline:gd.deadline, entities:{}, at:Date.now(), by:meId()};
  ENTITIES.forEach(e => { const x = (gd.entities && gd.entities[e.code]) || {}; body.entities[e.code] = {base:num(x.base), growth:num(x.growth), gm:num(x.gm), capexCap:num(x.capexCap)}; });
  try {
    if (S.demo) S.demoData.guidance = body; else await S.db.doc("cfg/guidance").set(body);
    S.guidanceDraft = null; renderCFO(); const mm = $("#gMsg"); if (mm) mm.textContent = "Đã lưu. Trưởng BU sẽ thấy ngay ở đầu biểu mẫu.";
  } catch (err) { if (m) m.textContent = `Chưa lưu được (${err && err.code || "lỗi"}).`; }
}

// ---------- render root ----------
function render(){
  renderChrome();
  if (S.tab === "bu") renderBU(); else renderCFO();
}
function setTab(t){
  S.tab = t; store.set("tab", t);
  if (location.hash !== "#" + t) history.replaceState(null, "", "#" + t);
  render();
}
function setDemo(on){
  S.demo = on;
  if (on && !S.demoData) S.demoData = makeDemo();
  S.draftFor = null; S.guidanceDraft = null; S.reviewOpen = null; S.formMsg = null;
  render();
}

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-tab]"); if (!t) return;
  if (t.dataset.tab) return setTab(t.dataset.tab);
  if (t.dataset.bu) {
    if (S.dirty && S.bu !== t.dataset.bu && !t.dataset.confirm) {
      S.formMsg = {cls:"warn", html:`<p>BU <b>${esc(BU[S.bu].name)}</b> có thay đổi chưa lưu. <button class="btn" type="button" data-act="save">Lưu nháp</button> <button class="btn" type="button" data-bu="${t.dataset.bu}" data-confirm="1">Bỏ thay đổi, chuyển BU</button></p>`};
      return renderBU();
    }
    S.bu = t.dataset.bu; store.set("bu", S.bu); S.draftFor = null; S.formMsg = null; render(); window.scrollTo({top:0}); return;
  }
  if (t.dataset.open) { S.bu = t.dataset.open; S.draftFor = null; S.formMsg = null; return setTab("bu"); }
  if (t.dataset.review) { S.reviewOpen = S.reviewOpen === t.dataset.review ? null : t.dataset.review; renderCFO(); const c = $("#reviewComment"); if (c) c.focus(); return; }
  if (t.dataset.decide) { if (t.dataset.decide === "cancel") { S.reviewOpen = null; return renderCFO(); } return decide(S.reviewOpen, t.dataset.decide); }
  if (t.dataset.copy) return copyText(exportText(t.dataset.copy), $("#copyMsg"));
  if (t.dataset.add) {
    const d = S.draft, n = d.granularity === "M" ? 12 : 4;
    const blank = {revenue:{id:uid(), kind:"Khách hàng lớn", name:"", unit:BU[S.bu].unit, price:0, gm:0, vol:zeros(n)}, headcount:{id:uid(), dept:"", salary:0, hc:zeros(n)}, opex:{id:uid(), name:"", amt:zeros(n)}, capex:{id:uid(), item:"", amount:0, month:1, note:""}, risks:{id:uid(), type:"Rủi ro", desc:"", impact:0, prob:"Trung bình"}}[t.dataset.add];
    d[t.dataset.add].push(blank); S.dirty = true; return renderBU();
  }
  if (t.dataset.del) { const [k, i] = t.dataset.del.split("."); S.draft[k].splice(Number(i), 1); S.dirty = true; return renderBU(); }
  const act = t.dataset.act;
  if (act === "save") return saveBu("draft");
  if (act === "submit") return saveBu("submit");
  if (act === "withdraw") return saveBu("withdraw");
  if (act === "reload") { S.draftFor = null; S.formMsg = null; return renderBU(); }
  if (act === "demo") return setDemo(true);
  if (act === "saveGuidance") return saveGuidance();
  if (t.id === "demoToggle") return setDemo(true);
  if (t.id === "demoExit") return setDemo(false);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.k && $("#buForm").contains(el)) {
    let v = el.type === "number" ? (el.value === "" ? 0 : Number(el.value)) : el.value;
    if (el.type === "radio") v = Number(el.value);
    if (el.dataset.k.endsWith(".month")) v = Number(el.value);
    setPath(S.draft, el.dataset.k, v);
    if (!S.dirty) { S.dirty = true; S.formMsg = null; }
    updateCalc();
  } else if (el.dataset.g) {
    const [co, k] = el.dataset.g.split(".");
    S.guidanceDraft.entities = S.guidanceDraft.entities || {};
    S.guidanceDraft.entities[co] = Object.assign({}, S.guidanceDraft.entities[co], {[k]: el.value === "" ? "" : Number(el.value)});
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "gran") { convertGran(S.draft, el.value); S.dirty = true; return renderBU(); }
  if (el.id === "onlyFinal") { S.onlyFinal = el.checked; return renderCFO(); }
  if (el.id === "exportGran") { S.exportGran = el.value; return renderCFO(); }
  if (el.dataset && el.dataset.k && el.tagName === "SELECT") { if (S.dirty) renderBuActionsHint(); }
});
function renderBuActionsHint(){ /* trạng thái chưa lưu hiển thị ở lần render kế tiếp */ }
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h === "bu" || h === "cfo") { S.tab = h; render(); } });
window.addEventListener("beforeunload", e => { if (S.dirty && !S.demo) { e.preventDefault(); e.returnValue = ""; } });

// ---------- live data ----------
function onBuChange(){
  renderChrome();
  if (S.tab === "cfo") renderCFO();
  else {
    const src = S.live.docs[S.bu];
    const remoteSaved = src ? src.savedAt || null : null;
    if (S.draftFor !== S.bu || !S.dirty) { if (!S.saving) { S.draftFor = null; renderBU(); } }
    else if (remoteSaved !== S.baseSavedAt && !S.remoteChanged) { S.remoteChanged = true; renderBU(); }
  }
}
async function connect(){
  const C = window.claude;
  if (!C || !C.use) { S.connected = false; renderViewer(); $("#connText").textContent = "Trang đang mở ngoài claude.ai nên không có kho dữ liệu dùng chung. Đang hiện dữ liệu mẫu."; setDemo(true); return; }
  const [db, user] = await Promise.all([C.use("db").catch(() => null), C.use("user").catch(() => null)]);
  S.user = user;
  if (user) {
    try { S.me = await user.me(); } catch {}
    try { S.isAdmin = await user.canEdit(); } catch {}
    try { S.canWrite = await user.can("data.write"); } catch { S.canWrite = null; }
  }
  renderViewer();
  if (!db) {
    $("#connText").textContent = "Không kết nối được kho dữ liệu dùng chung (cần đăng nhập claude.ai). Đang hiện dữ liệu mẫu.";
    S.connected = false; renderViewer(); setDemo(true); return;
  }
  S.db = db;
  let gotAny = false;
  const timer = setTimeout(() => { if (!gotAny) $("#connText").textContent = "Chưa tải được dữ liệu dùng chung. Kiểm tra mạng; trang sẽ tự cập nhật khi kết nối lại."; }, 10000);
  const done = () => { if (!gotAny) { gotAny = true; clearTimeout(timer); S.connected = true; S.loadedOnce = true; renderChrome(); } };
  const fail = err => { clearTimeout(timer); $("#connText").textContent = `Mất kết nối kho dữ liệu (${err && err.code || "lỗi"}). Tải lại trang để thử lại.`; $("#connBanner").hidden = false; };
  db.collection("bu").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S.live.docs = m;
    if (!snap.metadata.fromCache) done();
    if (!S.demo) onBuChange();
  }, fail);
  db.collection("review").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S.live.reviews = m;
    if (!S.demo) { renderChrome(); if (S.tab === "cfo") renderCFO(); else if (!S.dirty) { S.draftFor = null; renderBU(); } }
  }, fail);
  db.doc("cfg/guidance").onSnapshot(snap => {
    S.live.guidance = snap.exists ? snap.data() : null;
    if (!S.demo) { if (S.tab === "cfo") { S.guidanceDraft = null; renderCFO(); } else renderBU(); }
  }, fail);
}

// ---------- boot ----------
const h = location.hash.slice(1);
S.tab = (h === "bu" || h === "cfo") ? h : (store.get("tab") || "bu");
const sb = store.get("bu"); if (sb && BU[sb]) S.bu = sb;
render();
connect();
})();
</script>
